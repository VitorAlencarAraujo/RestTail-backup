<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/pages/style_login.css">

    <title>Login | RestTail</title>
</head>

<body class="bg">

    <main class="login-container">
        <div class="bg-img-dog">
            <img src="../assets/images/login/dog.png" alt="Cachorro do RestTail" draggable="false">
        </div>
        
        <div class="bg-paws" aria-hidden="true">
            <img src="../assets/images/login/paws.svg" alt="">
        </div>


        <section class="forms">

            <img src="../assets/images/login/logo.svg" class="logo" alt="Logo RestTail" draggable="false">

            <h1>BEM-VINDO</h1>
            <form action="#" method="post">
                <div class="form-group">

                    <label for="email"><img src="../assets/images/icon/icon-user.png" alt="">E-mail</label>

                    <input type="email" id="email"name="email" placeholder="Digite seu e-mail" autocomplete="email" required>

                </div>
                <div class="form-group">
                    <label for="password"><img src="../assets/images/icon/icon-lock.png" alt="">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>
                <div class="forgot-password">
                    <a href="./forgot.html">Esqueci minha senha</a>
                </div>
                <button type="submit" name="btn-login">Login</button>

                <p class="register-link">Novo aqui?
                    <a href="./register.html">Cadastre-se</a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
